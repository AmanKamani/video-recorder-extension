changelog:
  exclude:
    labels:
      - skip-changelog
      - dependencies

  categories:
    - title: "🚀 Features"
      labels:
        - feature
        - enhancement

    - title: "🐛 Fixes"
      labels:
        - bug
        - fix

    - title: "⚡ Improvements"
      labels:
        - performance
        - improvement
        - refactor

    - title: "📚 Documentation"
      labels:
        - documentation

    - title: "Other Changes"
      labels:
        - "*"